name: TG publish

# One post per slot: takes the first article of the recent days not yet
# recorded in content/social.json and sends it to the channel via Bot API.
on:
  schedule:
    - cron: "0 6,9,12,15,18 * * *"   # 09:00, 12:00, 15:00, 18:00, 21:00 МСК
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tg-publish
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML==6.0.2
      - run: python scripts/social.py send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      - name: Commit ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/social.json
          git diff --cached --quiet && exit 0
          git commit -m "tg: post $(date -u +%FT%TZ)"
          git pull --rebase origin main
          git push
