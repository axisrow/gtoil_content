name: Collect news

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install feedparser==6.0.11 PyYAML==6.0.2
      - run: python scripts/fetch_rss.py --hours 48
      - name: Commit inbox
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox/news
          git diff --cached --quiet && exit 0
          git commit -m "inbox: news $(date -u +%F\ %H:%M)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
