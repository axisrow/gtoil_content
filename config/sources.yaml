# RSS-источники новостей.
# filter: true — брать только записи с ключевыми словами из keywords.
# exclude — отбрасывать записи (во всех лентах), где в заголовке/анонсе есть эти слова: не про масла.
# Прямые ленты Lubes'n'Greases и Machinery Lubrication не парсятся (битый XML) или пустые,
# поэтому их новости берём через Google News с оператором site:.
keywords: [lubricant, lubricants, motor oil, engine oil, base oil, grease, api sn, api sp, api sq, acea, ilsac,
           масл, смазоч, присадк, антифриз]
exclude: [горюче-смазоч, гсм, взятк, уголовн, задержан, студент, вуз, товарооборот,
          market research, market size, market report, market to 20, cagr, forecast to 20]

feeds:
  - name: Lubes'n'Greases
    url: https://news.google.com/rss/search?q=site:lubesngreases.com&hl=en-US&gl=US&ceid=US:en
