# articles — раздел статей/новостей бренда: отсюда скилл oil-writer берёт идеи тем,
#            а scripts/fetch_competitors.py (GitHub Actions) собирает свежие заголовки
# rss      — лента статей сайта, если есть (пробуется первой)
# keywords — брать только статьи, в заголовке которых есть эти слова (отсекает, напр., автоспорт)
# Если в HTML раздела ссылок нет (список рисуется скриптом), сборщик ищет их в карте сайта.
# checked  — как проверен адрес: search = найден поиском по домену (2026-10-22),
#            known = общеизвестный глобальный сайт, не проверялся
# Правило: идеи тем — да; копирование текста и упоминание конкурентов в статьях — нет.

