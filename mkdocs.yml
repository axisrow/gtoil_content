site_name: GT Oil — всё о маслах
site_description: Новости индустрии, матчасть и советы по моторным и индустриальным маслам
site_url: https://axisrow.github.io/gtoil_content/
repo_url: https://github.com/axisrow/gtoil_content
docs_dir: docs
theme:
  name: material
  language: ru
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      toggle: { icon: material/brightness-7, name: Тёмная тема }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      toggle: { icon: material/brightness-4, name: Светлая тема }
  features:
    - content.code.copy
    - navigation.indexes
plugins:
  - search:
      lang: ru
  - blog:
      blog_dir: blog
      post_date_format: long
      post_url_format: "{date}/{slug}"
      post_excerpt: required
      categories_allowed: [Новости, Матчасть, Советы, Мифы]
  - tags
  - rss:
      use_git: false
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date
      categories: [categories, tags]
      abstract_chars_count: 280
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
nav:
  - Главная: index.md
  - Статьи:
      - blog/index.md
